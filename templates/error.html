<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ error_code }} — SmartLeave</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--bg-main);">

    <div class="card" style="max-width: 500px; text-align: center; padding: 3rem 2rem;">
        <div style="width: 70px; height: 70px; border-radius: 50%; background: var(--danger-bg); color: var(--danger); display: inline-flex; align-items: center; justify-content: center; font-size: 2rem; margin-bottom: 1.25rem;">
            <i class="fas fa-shield-xmark"></i>
        </div>
        
        <h1 style="font-size: 2.5rem; color: var(--primary); margin-bottom: 0.5rem;">{{ error_code }}</h1>
        <h3 style="font-size: 1.2rem; margin-bottom: 1rem;">{{ title or 'Access Denied / Error' }}</h3>
        <p style="color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 2rem;">
            {{ message or 'You do not have authorization to view this resource.' }}
        </p>

        <a href="/login" class="btn btn-primary" style="padding: 0.75rem 1.5rem;">
            <i class="fas fa-house"></i> Return to Login / Dashboard
        </a>
    </div>

</body>
</html>
